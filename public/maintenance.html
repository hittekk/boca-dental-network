<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boca Dental & Braces — Launching Soon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #001D3D 0%, #162E7A 60%, #1a3a8f 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: white;
  }
  .container { text-align: center; padding: 40px 24px; }
  .logo { font-size: 48px; margin-bottom: 24px; }
  h1 { font-size: clamp(28px, 5vw, 52px); font-weight: 800; letter-spacing: -2px; margin-bottom: 16px; }
  h1 span { color: #F3672A; }
  p { font-size: 18px; color: rgba(255,255,255,0.6); line-height: 1.7; max-width: 480px; margin: 0 auto 32px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(243,103,42,0.12); border: 1px solid rgba(243,103,42,0.3); border-radius: 999px; padding: 8px 20px; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #F3672A; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #F3672A; animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">🦷</div>
    <h1>Boca Dental<br /><span>& Braces</span></h1>
    <p>We're putting the finishing touches on our new website. Check back soon — something great is coming.</p>
    <div class="badge"><div class="dot"></div> Launching Soon · Las Vegas, NV</div>
  </div>
</body>
</html>
