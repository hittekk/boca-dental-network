[build]
  # Full chain: inject-schema + vite build + prerender + generate-sitemap.
  # Prerender runs in CI via @sparticuz/chromium (CI-safe headless Chrome), so a
  # normal git push deploys the fully prerendered site + sitemap.
  command   = "npm run build"
  publish   = "dist"

[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — any unknown route serves index.html so React Router handles it
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache static assets aggressively (filename-hashed by Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache index.html — needs to update so users get fresh JS hashes
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
