[build]
  # We build the full prerendered dist/ locally (npm run build → Puppeteer
  # captures the rendered DOM and Prettier formats it into 16k clean lines
  # of HTML for view-source). The deploy uploads the prebuilt dist/ as part
  # of the source (allowed by .netlifyignore), and this build command is a
  # no-op so Netlify doesn't overwrite it. Netlify then publishes dist/.
  command   = "echo 'Using prebuilt dist/ from local build'"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — any unknown route serves index.html so React Router handles it
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache static assets aggressively (filename-hashed by Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache index.html — needs to update so users get fresh JS hashes
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
